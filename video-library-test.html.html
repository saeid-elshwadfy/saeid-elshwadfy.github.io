<!doctype html>

<head>

<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d2e;--line:#29364b;--gold:#d9b66d;--text:#f4f0e8;--muted:#aeb8c8;--blue:#2864c5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a2940 0,#0b1220 55%);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7}.wrap{width:min(1180px,94%);margin:auto}.top{padding:34px 0 24px;border-bottom:1px solid var(--line)}.tag{color:var(--gold);font-size:.85rem;letter-spacing:.04em}.top h1{margin:5px 0;font-size:clamp(1.7rem,4vw,2.7rem)}.top p{color:var(--muted);margin:0;max-width:760px}.notice{margin:20px 0;padding:12px 16px;border:1px solid #806d43;background:#332b1b;border-radius:12px;color:#f4e2b8;font-size:.92rem}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.tools input,.tools select{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:12px 14px;border-radius:10px;font:inherit;min-width:180px}.tools input{flex:1;min-width:230px}.status{color:var(--muted);margin:8px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px;padding-bottom:40px}.card{background:linear-gradient(160deg,#172338,#101827);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 30px #0002}.cardmain{padding:17px 17px 8px;flex:1}.card h2{font-size:1.2rem;line-height:1.5;color:var(--gold);margin:0 0 8px}.desc{color:var(--muted);margin:0 0 14px;font-size:.94rem;white-space:pre-wrap}.player{background:#05080d;aspect-ratio:16/9;border-radius:10px;overflow:hidden}.player video,.player iframe{width:100%;height:100%;border:0;display:block}.emptyplayer{display:grid;place-items:center;height:100%;color:var(--muted);padding:20px;text-align:center}.stats{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;padding-top:10px}.actions{display:flex;gap:9px;flex-wrap:wrap;padding:12px 17px 17px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 13px;border-radius:9px;border:1px solid var(--line);color:var(--text);background:#1a2940;text-decoration:none;font:inherit;font-size:.9rem;cursor:pointer}.btn.primary{background:var(--gold);border-color:var(--gold);color:#17130a;font-weight:bold}.btn:disabled{opacity:.45;cursor:not-allowed}.foot{border-top:1px solid var(--line);padding:20px 0 30px;color:var(--muted);font-size:.85rem}.loading{padding:35px;text-align:center;color:var(--muted)}@media(max-width:520px){.tools input,.tools select{width:100%;min-width:0}.actions .btn{flex:1}}
</style>
</head>
<body><header class="top"><div class="wrap"><div class="tag">موقع الكاتب الروائي / سعيد الشوادفي</div><h1>🎬 مكتبة الفيديوهات</h1><p>موقع الكاتب الروائي / سعيد الشوادفي.</p></div></header>
<main class="wrap"><div class="notice">موقع الكاتب الروائي / سعيد الشوادفي</div><div class="tools"><input id="search" type="search" placeholder="ابحث باسم الفيديو أو وصفه…" aria-label="البحث في الفيديوهات"><select id="sort" aria-label="ترتيب الفيديوهات"><option value="new">الأحدث أولاً</option><option value="old">الأقدم أولاً</option><option value="az">الاسم أبجدياً</option></select></div><p id="status" class="status" aria-live="polite">جارٍ تحميل الفيديوهات…</p><section id="grid" class="grid"><div class="loading">جارٍ الاتصال بالمكتبة…</div></section></main>
<footer class="foot"><div class="wrap">مكتبة الفيديوهات — موقع الكاتب الروائي / سعيد الشوادفي</div></footer>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyDGG6NxTUZl5lLqD7qPq_nE0h6c_jVbaNA',authDomain:'saeid-elshwadfy.firebaseapp.com',databaseURL:'https://saeid-elshwadfy-default-rtdb.firebaseio.com',projectId:'saeid-elshwadfy',storageBucket:'saeid-elshwadfy.firebasestorage.app',messagingSenderId:'369531285459',appId:'1:369531285459:web:c2ff96822a96162a804926',measurementId:'G-ET702105DC'};
const grid=document.getElementById('grid'),status=document.getElementById('status'),search=document.getElementById('search'),sort=document.getElementById('sort');let videos=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function directDownload(url){if(!url)return '#';try{const u=new URL(url);if(u.hostname==='res.cloudinary.com'&&u.pathname.includes('/upload/')){u.pathname=u.pathname.replace('/upload/','/upload/fl_attachment/');return u.href;}return url;}catch{return url;}}
function render(){const q=search.value.trim().toLocaleLowerCase('ar');let list=videos.filter(v=>(String(v.title||'').toLocaleLowerCase('ar')+' '+String(v.desc||'').toLocaleLowerCase('ar')).includes(q));if(sort.value==='new')list.sort((a,b)=>(Number(b.updatedAt)||0)-(Number(a.updatedAt)||0));if(sort.value==='old')list.sort((a,b)=>(Number(a.updatedAt)||0)-(Number(b.updatedAt)||0));if(sort.value==='az')list.sort((a,b)=>String(a.title||'').localeCompare(String(b.title||''),'ar'));status.textContent=`${list.length.toLocaleString('ar-EG')} فيديو`;if(!list.length){grid.innerHTML='<div class="loading">لا توجد فيديوهات مطابقة للبحث حالياً.</div>';return;}grid.innerHTML=list.map(v=>{const url=String(v.videoUrl||'');let player='';if(/youtube\.com|youtu\.be/i.test(url)){let id='';try{const u=new URL(url);if(u.hostname.includes('youtu.be'))id=u.pathname.slice(1);else if(u.pathname.includes('/embed/'))id=u.pathname.split('/embed/')[1].split('/')[0];else id=u.searchParams.get('v')||'';}catch{}player=id?`<iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}" title="${esc(v.title||'فيديو')}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`:'<div class="emptyplayer">تعذر تحديد رابط فيديو YouTube</div>';}else if(url){player=`<video controls preload="metadata" playsinline title="${esc(v.title||'فيديو')}"><source src="${esc(url)}">متصفحك لا يدعم تشغيل الفيديو.</video>`;}else player='<div class="emptyplayer">لا يوجد رابط فيديو متاح</div>';const shareUrl=location.origin+location.pathname+'#video-'+encodeURIComponent(v.id);return `<article class="card" id="video-${esc(v.id)}"><div class="cardmain"><h2>${esc(v.title||'فيديو بدون عنوان')}</h2><p class="desc">${esc(v.desc||'')}</p><div class="player">${player}</div><div class="stats"><span>👁️ ${Number(v.views||0).toLocaleString('ar-EG')} مشاهدة</span><span>⭐ ${Number(v.ratingCount||0).toLocaleString('ar-EG')} تقييم</span></div></div><div class="actions">${url?`<a class="btn primary" href="${esc(directDownload(url))}" download rel="noopener noreferrer">📥 تنزيل</a>`:''}<button class="btn" type="button" data-share="${esc(v.id)}">🔗 مشاركة</button></div></article>`;}).join('');grid.querySelectorAll('[data-share]').forEach(btn=>btn.addEventListener('click',async()=>{const v=videos.find(x=>String(x.id)===btn.dataset.share);const url=location.origin+location.pathname+'#video-'+encodeURIComponent(v?.id||'');const data={title:(v?.title||'فيديو')+' | مكتبة الفيديوهات',text:(v?.title||'فيديو')+' — مكتبة الفيديوهات',url};try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard){await navigator.clipboard.writeText(url);btn.textContent='✓ تم نسخ الرابط';}else window.prompt('انسخ رابط الفيديو:',url);}catch(e){if(e?.name!=='AbortError')alert('تعذرت المشاركة من هذا المتصفح.');}}));}
search.addEventListener('input',render);sort.addEventListener('change',render);
try{const app=initializeApp(firebaseConfig);onValue(ref(getDatabase(app),'videos'),snap=>{const data=snap.val();videos=data?Object.entries(data).map(([id,v])=>({id,...v})):[];render();},err=>{console.error(err);status.textContent='تعذر تحميل الفيديوهات من Firebase. قد تكون قواعد القراءة لا تسمح لهذه الصفحة.';grid.innerHTML='<div class="loading">تعذر تحميل المكتبة. راجع وحدة التحكم وقواعد القراءة دون تغييرها الآن.</div>';});}catch(e){console.error(e);status.textContent='حدث خطأ أثناء تهيئة الاتصال بالمكتبة.';grid.innerHTML='<div class="loading">تعذر الاتصال بقاعدة البيانات.</div>';}
</script></body></html>
